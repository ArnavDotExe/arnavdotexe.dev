name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-flight run when a newer one starts. With this false, a run
# queued for an older commit can finish *after* a newer commit's run and
# overwrite it — confirmed via the Deployments API: a rerun for an earlier
# SHA landed after the correct one and became the "latest" live deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build:pages
        env:
          # This repo is named <user>.github.io, GitHub's special "user site"
          # naming — it's served at the account root with no path prefix, so
          # NEXT_PUBLIC_BASE_PATH is intentionally not set here (see
          # next.config.ts: an unset basePath means root-level serving).
          NEXT_PUBLIC_SITE_URL: https://arnavdotexe.github.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
