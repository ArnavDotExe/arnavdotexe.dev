<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <clipPath id="frame">
      <rect x="0" y="0" width="200" height="200" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="200" height="200" fill="#161a24" />
    <rect
      width="200"
      height="200"
      fill="none"
      stroke="#89dceb"
      stroke-width="2"
      stroke-dasharray="6 6"
      opacity="0.55"
    />

    <!-- dot-grid texture, matches the site's terminal aesthetic -->
    <g fill="#262b38">
      <circle cx="20" cy="20" r="1.4" /><circle cx="40" cy="20" r="1.4" /><circle cx="60" cy="20" r="1.4" /><circle cx="80" cy="20" r="1.4" /><circle cx="100" cy="20" r="1.4" /><circle cx="120" cy="20" r="1.4" /><circle cx="140" cy="20" r="1.4" /><circle cx="160" cy="20" r="1.4" /><circle cx="180" cy="20" r="1.4" />
      <circle cx="20" cy="180" r="1.4" /><circle cx="40" cy="180" r="1.4" /><circle cx="60" cy="180" r="1.4" /><circle cx="80" cy="180" r="1.4" /><circle cx="100" cy="180" r="1.4" /><circle cx="120" cy="180" r="1.4" /><circle cx="140" cy="180" r="1.4" /><circle cx="160" cy="180" r="1.4" /><circle cx="180" cy="180" r="1.4" />
    </g>

    <!-- person silhouette -->
    <circle cx="100" cy="82" r="34" fill="none" stroke="#89dceb" stroke-width="3" />
    <path
      d="M40 168c8-38 38-58 60-58s52 20 60 58"
      fill="none"
      stroke="#89dceb"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>

  <rect x="0.5" y="0.5" width="199" height="199" rx="14" fill="none" stroke="#262b38" stroke-width="1" />
</svg>
